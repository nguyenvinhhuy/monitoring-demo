name: monitoring-demo

networks:
  monitoring-demo-net:
    name: monitoring-demo-net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: monitoring-demo/user-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8080"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: monitoring-demo/product-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8091:8081"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: monitoring-demo/order-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8092:8082"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - tempo
    # Image contrib là distroless (không có wget/curl/shell) nên không thể healthcheck kiểu
    # CMD từ trong container; dựa vào log "Everything is ready" hoặc Prometheus target "up"
    # để xác nhận collector đã sẵn sàng thay vì Docker healthcheck.

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - otel-collector

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Đặt GRAFANA_ADMIN_PASSWORD trong file .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "--docker_only=true"
    volumes:
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8093:8080"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [monitoring-demo-net]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - loki
