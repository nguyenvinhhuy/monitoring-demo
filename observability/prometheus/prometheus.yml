global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Không scrape trực tiếp 3 service nữa — app push OTLP vào otel-collector,
  # Prometheus chỉ scrape 1 điểm duy nhất là collector (xem observability/README.md).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
