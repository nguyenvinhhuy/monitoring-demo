# Cấu hình single-binary tối giản cho học tập — lưu trên filesystem local, không phải object
# storage (S3/GCS/MinIO) như prod thật cần cho scale lớn + retention dài hạn.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Demo học tập: chấp nhận log gửi trễ vài giờ (đủ cho việc bạn dừng/khởi động lại container khi
  # test chaos) — prod thật nên siết chặt hơn.
  reject_old_samples: false
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
